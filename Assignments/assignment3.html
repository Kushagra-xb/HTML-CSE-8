<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Block and Inline Elements</title>
  <style>
    /* Block elements take the full width and start on a new line */
    div { background: lightblue; margin: 5px; padding-left: 5px; }
    /* Inline elements take only the width of their content and stay on the same line */
    span { background: lightgreen; padding: 0 3px; }
  </style>
</head>
<body style="margin:0;">
  <div>Block 1</div>
  <div>Block 2</div>
  <span>Inline 1</span>
  <span>Inline 2</span>
  <span>Inline 3</span>
</body>
</html>
