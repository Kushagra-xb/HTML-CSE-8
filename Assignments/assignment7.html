<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 7 - Navigation Menu</title>
  <style>
    nav ul {
      list-style: none;      /* remove bullets */
      margin: 0;
      padding: 0;
      background: #333;
      overflow: hidden;
    }
    nav li { float: left; }  /* line the items up horizontally */
    nav a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
    }
    nav a:hover { background: #555; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
