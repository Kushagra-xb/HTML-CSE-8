<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 15 - Form Inputs</title>
</head>
<body>
  <form>
    <fieldset>
      <legend>Personal Details</legend>

      <p><label for="name">Name:</label>
         <input type="text" id="name" name="name"></p>

      <p><label for="email">Email:</label>
         <input type="email" id="email" name="email"></p>

      <p><label for="password">Password:</label>
         <input type="password" id="password" name="password"></p>

      <p>Gender:
         <label><input type="radio" name="gender" value="male">Male</label>
         <label><input type="radio" name="gender" value="female">Female</label></p>

      <p>Hobbies:
         <label><input type="checkbox" name="hobby" value="reading">Reading</label>
         <label><input type="checkbox" name="hobby" value="coding">Coding</label></p>

      <p><label for="dob">DOB:</label>
         <input type="date" id="dob" name="dob"></p>
    </fieldset>
  </form>
</body>
</html>
