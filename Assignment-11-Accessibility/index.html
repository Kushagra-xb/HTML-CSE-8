<!DOCTYPE html>
<html lang="en"> <!-- lang tells screen readers which language to use -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 11 - Accessibility</title>
</head>
<body>
  <!-- Skip link: lets keyboard users jump past the navigation -->
  <a href="#main">Skip to main content</a>

  <nav aria-label="Main navigation">
    <a href="#">Home</a>
    <a href="#">Help</a>
  </nav>

  <main id="main">
    <h1>Accessible Page</h1>

    <!-- alt text describes the image; aria-label names the icon-only button -->
    <img src="banner.png" alt="College banner" width="275" height="20">
    <button type="button" aria-label="Close">X</button>

    <p>
      <label for="search">Search:</label>
      <input type="text" id="search" name="search">
    </p>
  </main>
</body>
</html>
