<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 13 - Timetable</title>
  <style>
    table { border-collapse: collapse; text-align: center; }
    th, td { border: 1px solid #333; padding: 10px 14px; }
    caption { font-weight: bold; padding: 4px; }
  </style>
</head>
<body>
  <table>
    <caption>Weekly Timetable</caption>
    <tr>
      <th>Day</th><th>9-10</th><th>10-11</th><th>11-12</th>
    </tr>
    <tr>
      <td>Mon</td><td>Maths</td><td>HTML</td>
      <td rowspan="2">Web Lab</td>      <!-- merges two rows -->
    </tr>
    <tr>
      <td>Tue</td><td>DBMS</td><td>OS</td>
    </tr>
    <tr>
      <td>Wed</td>
      <td colspan="3">Seminar</td>      <!-- merges three columns -->
    </tr>
  </table>
</body>
</html>
